name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - name: Extension host (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vscode
      - name: Extension host (desktop)
        if: runner.os != 'Linux'
        run: npm run test:vscode
      - run: npm run package
